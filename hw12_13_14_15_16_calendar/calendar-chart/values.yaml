# Default values for calendar-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: calendar-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# Configuration for the three processes
api:
  enabled: true
  replicaCount: 1
  image:
    repository: calendar-api
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
    containerPort: 8080

scheduler:
  enabled: true
  replicaCount: 1
  image:
    repository: calendar-scheduler
    tag: "latest"

sender:
  enabled: true
  replicaCount: 1
  image:
    repository: calendar-sender
    tag: "latest"

# Database configuration
postgres:
  enabled: true
  image: postgres:15
  user: calendar
  password: calendar
  database: calendar
  port: 5432
  persistence:
    enabled: true
    size: 1Gi

# RabbitMQ configuration
rabbitmq:
  enabled: true
  image: rabbitmq:3-management
  user: calendar
  password: calendar
  port: 5672
  managementPort: 15672

# Environment variables
config:
  storageType: "sql"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: calendar.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}