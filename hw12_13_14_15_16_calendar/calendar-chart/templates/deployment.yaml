{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "calendar-chart.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "calendar-chart.name" . }}-api
    {{- include "calendar-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "calendar-chart.name" . }}-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "calendar-chart.name" . }}-api
    spec:
      initContainers:
        - name: migrate
          image: "calendar-migrate:latest"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              until goose -dir /migrations postgres "host={{ include "calendar-chart.fullname" . }}-postgres port={{ .Values.postgres.port }} user={{ .Values.postgres.user }} password={{ .Values.postgres.password }} dbname={{ .Values.postgres.database }} sslmode=disable" up; do
                echo "Waiting for postgres..."
                sleep 2
              done
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.containerPort }}
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ include "calendar-chart.fullname" . }}-postgres
            - name: DB_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: DB_USER
              value: {{ .Values.postgres.user }}
            - name: DB_PASSWORD
              value: {{ .Values.postgres.password }}
            - name: DB_NAME
              value: {{ .Values.postgres.database }}
            - name: RABBITMQ_HOST
              value: {{ include "calendar-chart.fullname" . }}-rabbitmq
            - name: RABBITMQ_USER
              value: {{ .Values.rabbitmq.user }}
            - name: RABBITMQ_PASSWORD
              value: {{ .Values.rabbitmq.password }}
            - name: STORAGE_TYPE
              value: {{ .Values.config.storageType }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: migrations
          configMap:
            name: {{ include "calendar-chart.fullname" . }}-migrations
{{- end }}

{{- if .Values.scheduler.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "calendar-chart.fullname" . }}-scheduler
  labels:
    app.kubernetes.io/name: {{ include "calendar-chart.name" . }}-scheduler
    {{- include "calendar-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "calendar-chart.name" . }}-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "calendar-chart.name" . }}-scheduler
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: alpine:latest
          command: ["sh", "-c", "until nc -z {{ include "calendar-chart.fullname" . }}-rabbitmq {{ .Values.rabbitmq.port }}; do echo waiting for rabbitmq; sleep 2; done;"]
      containers:
        - name: scheduler
          image: "{{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.scheduler.image.pullPolicy | default .Values.image.pullPolicy }}
          env:
            - name: DB_HOST
              value: {{ include "calendar-chart.fullname" . }}-postgres
            - name: DB_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: DB_USER
              value: {{ .Values.postgres.user }}
            - name: DB_PASSWORD
              value: {{ .Values.postgres.password }}
            - name: DB_NAME
              value: {{ .Values.postgres.database }}
            - name: RABBITMQ_HOST
              value: {{ include "calendar-chart.fullname" . }}-rabbitmq
            - name: RABBITMQ_USER
              value: {{ .Values.rabbitmq.user }}
            - name: RABBITMQ_PASSWORD
              value: {{ .Values.rabbitmq.password }}
            - name: STORAGE_TYPE
              value: {{ .Values.config.storageType }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}

