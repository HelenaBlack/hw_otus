# Docker Compose конфигурация для приложения Календарь
# Определяет все микросервисы: PostgreSQL, RabbitMQ, Calendar, Scheduler, Sender
version: '3.8'
services:
  # Сервис PostgreSQL для хранения данных
  postgres:
    image: postgres:15
    container_name: calendar-postgres
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ для очереди уведомлений
  rabbitmq:
    image: rabbitmq:3-management
    container_name: calendar-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Основное приложение Календарь (API)
  calendar:
    build:
      context: .
      dockerfile: ./build/Dockerfile
    container_name: calendar-api
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./configs/config_docker.yaml:/etc/calendar/config.yaml:ro
      - ./migrations:/migrations:ro
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: unless-stopped
    command: ["/opt/calendar/calendar", "-config", "/etc/calendar/config.yaml"]

  # Планировщик - отправляет уведомления в очередь
  scheduler:
    build:
      context: .
      dockerfile: ./build/Dockerfile
    container_name: calendar-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./configs/config_docker.yaml:/etc/calendar/config.yaml:ro
    restart: unless-stopped
    command: ["/opt/calendar/calendar_scheduler", "-config", "/etc/calendar/config.yaml"]

  # Рассыльщик - обрабатывает уведомления из очереди
  sender:
    build:
      context: .
      dockerfile: ./build/Dockerfile
    container_name: calendar-sender
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./configs/config_docker.yaml:/etc/calendar/config.yaml:ro
    restart: unless-stopped
    command: ["/opt/calendar/calendar_sender", "-config", "/etc/calendar/config.yaml"]

# Именованные тома для постоянного хранения данных
volumes:
  pgdata: