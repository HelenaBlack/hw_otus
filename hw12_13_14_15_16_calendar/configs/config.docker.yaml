# Configuration for Docker environment
# Most values are provided via environment variables or defaults in code

logger:
  level: "debug"

storage:
  type: "sql"

server:
  host: "0.0.0.0"
  port: 8080
  grpcPort: 50051

db:
  host: "postgres"
  port: 5432
  user: "calendar"
  password: "calendar"
  dbname: "calendar"

rabbitmq:
  host: "rabbitmq"
  port: 5672
  user: "guest"
  password: "guest"
  queue: "calendar"

scheduler:
  scanInterval: 5

sender:
  workerCount: 5
