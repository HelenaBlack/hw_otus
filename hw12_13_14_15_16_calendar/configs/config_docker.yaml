# Конфигурационный файл для сервиса Календарь (Docker-окружение)
# Формат: YAML

logger:
  # Уровень логирования: error, warn, info, debug
  level: INFO

storage:
  # Тип хранилища: memory или sql
  type: sql

server:
  # Адрес и порт для серверов
  host: 0.0.0.0
  port: 8080
  grpcPort: 50051

db:
  # Настройки подключения к базе данных (используется, если storage.type = sql)
  host: postgres
  port: 5432
  user: calendar
  password: calendar
  dbname: calendar

rabbitmq:
  host: rabbitmq
  port: 5672
  user: guest
  password: guest
  queue: notifications

scheduler:
  scanInterval: 10

sender:
  workerCount: 5
